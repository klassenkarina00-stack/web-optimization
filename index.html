<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Великие горы мира</title>
     <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #2c3e50;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 10px;
        }
        h1 {
            color: #2980b9;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        h2 {
            color: #34495e;
            margin-top: 30px;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .img-container {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }
        img:hover {
            transform: scale(1.02);
        }
        .btn-wrapper {
            text-align: center;
            margin-top: 40px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Самые милые животные в мире</h1>
    
    <h2>Котик</h2>
    <img src="images/animal1.jpg" alt="">

    <h2>Лошадка</h2>
    <img src="images/animal2.jpg" alt="">

    <h2>Лвенок</h2>
    <img src="images/animal4.jpg" alt="">

    <h2>Лошадки</h2>
    <img src="images/animal5.jpg" alt="">

    <h2>Львята</h2>
    <img src="images/animal6.jpg" alt="">

      <h2>Медвежата</h2>
    <img src="images/animal7.jpg" alt="">

    <a href="https://wikipedia.org" class="btn" target="_blank">Узнать больше о животных</a>

</body>
</html>
